# IGNIVO SafetyTech System - Production Reverse Proxy Gateway
# Cấu hình Nginx lắng nghe tại cổng chuẩn 80 (HTTP) định tuyến tới Unified Gateway

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Bật nén Gzip tối ưu truyền tải mạng
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache tĩnh cho ảnh snapshot và avatar
    location /static/ {
        alias /home/pi5/Desktop/FireEye_Project/FireEye/FireEye/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy toàn bộ API, Dashboard và Web UI tới Unified Gateway (Port 8000)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình timeout cho luồng video stream và phân tích AI
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }
}
